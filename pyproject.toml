[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdeltnews"
version = "1.0.23"
description = "Reconstruct full-text news articles from GDELT Web News NGrams 3.0"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{ name = "Andrea Fronzetti Colladon" }, { name = "Roberto Vestrelli" }]
dependencies = [
  "requests>=2.0",
  "tqdm>=4.0",
  "boolean.py>=5.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Science/Research",
]
keywords = ["gdelt", "webngrams", "news", "nlp"]

# Optional speedup: isal's igzip decompresses the .json.gz files several times
# faster than the stdlib gzip module. gdeltnews falls back to gzip when it is
# not installed, so this is purely a performance extra.
[project.optional-dependencies]
fast = ["isal>=1.1"]

[project.urls]
Homepage = "https://github.com/iandreafc/gdeltnews"
Repository = "https://github.com/iandreafc/gdeltnews"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
